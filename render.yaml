services:
  - type: web
    name: predelinquency-risk-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: AWS_ENABLED
        value: false
      - key: ALLOWED_ORIGINS
        value: http://localhost:5173
